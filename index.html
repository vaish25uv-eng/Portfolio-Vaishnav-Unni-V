/* ------------------------------------------------------------
   STORAGE
   ------------------------------------------------------------
   IMPORTANT: localStorage persists edits on the admin/browser, but it is
   intentionally not shared between different visitors. A static HTML file
   cannot rewrite its deployed source or broadcast admin edits to everyone.
   For true shared live publishing, connect savePortfolio/loadPortfolio to a
   server/database (and keep credentials server-side).
   ------------------------------------------------------------ */
async function loadPortfolio() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}
async function savePortfolio(data) {
  window.localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  return true;
}

function mergeSections(defaults, loaded) {
  if (!Array.isArray(loaded)) return defaults;
  const byId = {};

function Header({ data, activeSection, goTo, menuOpen, setMenuOpen, scrolled }) {
  const visibleSections = data.sections.filter((s) => s.visible).sort((a, b) => a.order - b.order);
  return (
    <header className={`ps-header ${scrolled ? "scrolled" : ""}`}>
      <div className="ps-container ps-header-inner">
        <div style={{ display: "flex", alignItems: "center", gap: 32, minWidth: 0 }}>
          <div style={{ minWidth: 0 }}>
            <div className="ps-brand-name"><span className="ps-brand-dot" />{data.profile.name.toUpperCase()}</div>
            <div className="ps-brand-sub">{data.profile.title}</div>
          </div>
          <nav className="ps-nav">
            {visibleSections.map((s) => (
              <button key={s.id} className={`ps-nav-btn ${activeSection === s.id ? "active" : ""}`} onClick={() => goTo(s.id)}>
                {s.label}
              </button>
            ))}
          </nav>
        </div>
        <div className="ps-header-actions">
          <a className="ps-pill-link" href={`mailto:${data.profile.email}`}><Mail size={14} />{data.profile.email}</a>
          <a className="ps-icon-btn" href={data.profile.linkedinUrl} target="_blank" rel="noopener noreferrer"><Linkedin size={16} /></a>
        </div>
        <button className="ps-burger" onClick={() => setMenuOpen((v) => !v)} aria-label="Toggle menu">
          {menuOpen ? <X size={18} /> : <Menu size={18} />}
        </button>
        {menuOpen && (
          <div className="ps-mobile-menu">
            {visibleSections.map((s) => (
              <button key={s.id} className={`ps-mobile-link ${activeSection === s.id ? "active" : ""}`} onClick={() => goTo(s.id)}>
                {s.label}
              </button>
            ))}
            <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
              <a className="ps-btn-primary" style={{ flex: 1, justifyContent: "center" }} href={`mailto:${data.profile.email}`}><Mail size={16} /> Email</a>
              <a className="ps-btn-outline" style={{ flex: 1, justifyContent: "center" }} href={data.profile.linkedinUrl} target="_blank" rel="noopener noreferrer"><Linkedin size={16} /> LinkedIn</a>
            </div>
          </div>
        )}
      </div>
    </header>
  );
}

function Marquee({ items, reverse }) {
  if (!items || items.length === 0) return null;
  const doubled = [...items, ...items, ...items];
  return (
    <div className="ps-marquee-wrap">
      <div className={`ps-marquee-track ${reverse ? "reverse" : ""}`}>
        {doubled.map((it, i) => (
          <span key={i} className="ps-marquee-item"><span style={{ width: 4, height: 4, borderRadius: 999, background: "var(--ps-accent)", flexShrink: 0 }} />{it}</span>
        ))}
      </div>
    </div>
  );
}

function SectionHead({ section, align }) {
  return (
    <div className="ps-section-head" style={align === "center" ? { justifyContent: "flex-start" } : undefined}>

      {section.description && <div className="ps-section-desc">{section.description}</div>}
    </div>
  );
}

const BUILT_IN_COMPONENTS = {
  about: AboutHero,
  experience: ExperienceSection,
  education: EducationSection,
  projects: ProjectsSection,

  contact: ContactSection,
};

function PublicSite({ data, parallax, goTo }) {
  const ordered = [...data.sections].filter((s) => s.visible).sort((a, b) => a.order - b.order);
  return (
    <>
      {ordered.map((s) => {
        if (s.custom) return <CustomSectionView key={s.id} section={s} />;
        const Cmp = BUILT_IN_COMPONENTS[s.id];
        if (!Cmp) return null;
        if (s.id === "about") return <Cmp key={s.id} data={data} parallax={parallax} />;
        if (s.id === "contact") return <Cmp key={s.id} data={data} goTo={goTo} />;
        return <Cmp key={s.id} data={data} />;
      })}
    </>
  );
}

function Field({ label, children, hint }) {
  return (
    <div className="ps-field">
      <label>{label}</label>
      {children}
      {hint && <div className="ps-hint">{hint}</div>}
    </div>

function MoveButtons({ index, count, onMove, onDelete, onToggleVisible, visible }) {
  return (
    <div className="ps-icon-row">
      {onToggleVisible && (
        <button className="ps-mini-btn" title={visible ? "Hide" : "Show"} onClick={onToggleVisible}>
          {visible ? <Eye size={14} /> : <EyeOff size={14} />}
        </button>
      )}
      <button className="ps-mini-btn" disabled={index === 0} title="Move up" onClick={() => onMove(-1)}><ChevronUp size={14} /></button>

function TagListEditor({ items, onChange, placeholder }) {
  const [draft, setDraft] = useState("");
  const add = () => { if (draft.trim()) { onChange([...items, draft.trim()]); setDraft(""); } };
  return (
    <div>
      <div className="ps-list-tags" style={{ marginBottom: 8 }}>

          <span key={i} className="ps-list-tag">{it}<button onClick={() => onChange(items.filter((_, idx) => idx !== i))}><X size={10} /></button></span>

      </div>
      <div style={{ display: "flex", gap: 8 }}>
        <input className="ps-input" placeholder={placeholder || "Add item…"} value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => e.key === "Enter" && (e.preventDefault(), add())} />
        <button className="ps-btn-studio-ghost" onClick={add}><Plus size={14} /></button>
      </div>
    </div>

function ImagePicker({ value, onChange, label, hint }) {
  const fileRef = useRef(null);
  const onFile = async (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    const dataUrl = await fileToDataURL(f);
    onChange(dataUrl);
  };
  return (
    <Field label={label} hint={hint}>
      <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
        <div className="ps-photo-preview">{value && <img src={value} alt="preview" />}</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, flex: 1, minWidth: 0 }}>
          <input className="ps-input" placeholder="Image URL" value={value && value.startsWith("data:") ? "" : value || ""} onChange={(e) => onChange(e.target.value)} />
          <label className="ps-file-btn">
            <ImagePlus size={13} /> Upload image
            <input ref={fileRef} type="file" accept="image/*" style={{ display: "none" }} onChange={onFile} />
          </label>
        </div>
      </div>
    </Field>
  );
}

/* ---- Tab: Experience ---- */
function TabExperience({ data, update }) {
  const list = data.experience;
  const setList = (fn) => update((d) => ({ ...d, experience: fn(d.experience) }));
  const move = (i, dir) => setList((l) => { const arr = [...l]; const j = i + dir; if (j < 0 || j >= arr.length) return l; [arr[i], arr[j]] = [arr[j], arr[i]]; return arr; });
  const del = (id) => setList((l) => l.filter((x) => x.id !== id));
  const patch = (id, k, v) => setList((l) => l.map((x) => x.id === id ? { ...x, [k]: v } : x));
  const addPoint = (id) => setList((l) => l.map((x) => x.id === id ? { ...x, points: [...x.points, "New responsibility or achievement"] } : x));
  const editPoint = (id, i, v) => setList((l) => l.map((x) => x.id === id ? { ...x, points: x.points.map((p, idx) => idx === i ? v : p) } : x));
  const delPoint = (id, i) => setList((l) => l.map((x) => x.id === id ? { ...x, points: x.points.filter((_, idx) => idx !== i) } : x));
  const add = () => setList((l) => [...l, { id: uid("exp"), visible: true, role: "New Role", company: "Company", period: "2026 — Present", type: "Full-time", points: [] }]);

  return (
    <div>
      {list.map((x, i) => (
        <div key={x.id} className="ps-entity-card">
          <div className="ps-entity-head">
            <span className="ps-entity-title">{x.role || "Untitled role"}</span>
            <MoveButtons index={i} count={list.length} onMove={(dir) => move(i, dir)} onDelete={() => del(x.id)} onToggleVisible={() => patch(x.id, "visible", !x.visible)} visible={x.visible} />
          </div>
          <Field label="Job title"><input className="ps-input" value={x.role} onChange={(e) => patch(x.id, "role", e.target.value)} /></Field>
          <Field label="Company"><input className="ps-input" value={x.company} onChange={(e) => patch(x.id, "company", e.target.value)} /></Field>
          <div className="ps-row-2">
            <Field label="Period"><input className="ps-input" value={x.period} onChange={(e) => patch(x.id, "period", e.target.value)} /></Field>
            <Field label="Type / location"><input className="ps-input" value={x.type} onChange={(e) => patch(x.id, "type", e.target.value)} /></Field>
          </div>
          <label style={{ display: "block", fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700, color: "rgba(255,255,255,0.45)", marginBottom: 7 }}>Responsibilities &amp; achievements</label>
          {x.points.map((pt, pi) => (
            <div key={pi} style={{ display: "flex", gap: 6, marginBottom: 6 }}>
              <textarea className="ps-textarea" style={{ minHeight: 40 }} value={pt} onChange={(e) => editPoint(x.id, pi, e.target.value)} />
              <button className="ps-mini-btn danger" onClick={() => delPoint(x.id, pi)}><Trash2 size={14} /></button>
            </div>
          ))}
          <button className="ps-add-btn" onClick={() => addPoint(x.id)}><Plus size={14} /> Add bullet point</button>
        </div>
      ))}
      <button className="ps-add-btn" onClick={add}><Plus size={16} /> Add experience</button>
    </div>
  );
}

      <>
        {items.map((it) => (
          <div key={it.id} className="ps-row-2" style={{ marginBottom: 8 }}>

      </>

  if (section.type === "gallery") {
    return (
      <>
        {items.map((it) => (
          <div key={it.id} className="ps-entity-card">
            <div className="ps-icon-row" style={{ justifyContent: "flex-end", marginBottom: 8 }}><button className="ps-mini-btn danger" onClick={() => del(it.id)}><Trash2 size={14} /></button></div>

          </div>

/* ---- Tab: Sections manager (incl. custom sections) ---- */
const CUSTOM_TYPE_OPTIONS = [
  { value: "text", label: "Text block", icon: FileJson },
  { value: "cards", label: "Cards", icon: LayoutGrid },
  { value: "stats", label: "Stats", icon: TrendingUp },
  { value: "gallery", label: "Image gallery", icon: ImagePlus },
  { value: "quote", label: "Quote", icon: QuoteIcon },
  { value: "links", label: "Links", icon: Link2 },
];

function TabSections({ data, update }) {
  const sections = [...data.sections].sort((a, b) => a.order - b.order);
  const [newType, setNewType] = useState("text");
  const setSections = (arr) => update((d) => ({ ...d, sections: arr.map((s, i) => ({ ...s, order: i })) }));
  const move = (i, dir) => { const arr = [...sections]; const j = i + dir; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; setSections(arr); };
  const toggle = (id) => setSections(sections.map((s) => s.id === id ? { ...s, visible: !s.visible } : s));
  const rename = (id, label) => setSections(sections.map((s) => s.id === id ? { ...s, label } : s));
  const del = (id) => setSections(sections.filter((s) => s.id !== id));

  const addCustom = () => {
    const id = uid("section");
    const newSection = {
      id, label: "New Section", visible: true, custom: true, type: newType,
      eyebrow: "", title: "New Section", description: "",
      content: JSON.parse(JSON.stringify(CUSTOM_SECTION_DEFAULTS[newType])),
    };
    setSections([...sections, newSection]);
  };

  return (
    <div>
      <p className="ps-hint" style={{ marginBottom: 16 }}>Reorder sections, rename them, toggle visibility, or add a brand-new custom section. This list controls both the navigation menu and the page layout.</p>
      {sections.map((s, i) => (
        <div key={s.id} className="ps-entity-card">
          <div className="ps-entity-head">
            <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
              <GripVertical size={14} style={{ opacity: 0.4, flexShrink: 0 }} />
              <input className="ps-input" style={{ width: 150 }} value={s.label} onChange={(e) => rename(s.id, e.target.value)} />
            </div>
            <div className="ps-icon-row">
              <button className={`ps-vis-toggle ${s.visible ? "" : "off"}`} onClick={() => toggle(s.id)} disabled={s.locked}>
                {s.visible ? <Eye size={12} /> : <EyeOff size={12} />} {s.visible ? "Visible" : "Hidden"}
              </button>
              <button className="ps-mini-btn" disabled={i === 0} onClick={() => move(i, -1)}><ChevronUp size={14} /></button>
              <button className="ps-mini-btn" disabled={i === sections.length - 1} onClick={() => move(i, 1)}><ChevronDown size={14} /></button>
              {s.custom && <button className="ps-mini-btn danger" onClick={() => del(s.id)}><Trash2 size={14} /></button>}
            </div>
          </div>
          {s.locked && <div className="ps-hint">This section can't be hidden — it anchors the top and bottom of the page.</div>}
          {s.custom && (
            <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px solid rgba(255,255,255,0.08)" }}>
              <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700, color: "rgba(255,255,255,0.4)", marginBottom: 10 }}>
                {CUSTOM_TYPE_OPTIONS.find((t) => t.value === s.type)?.label || s.type} section
              </div>
              <SectionTextFields sectionId={s.id} data={data} update={update} />
              <CustomContentEditor section={s} update={update} />
            </div>
          )}
        </div>
      ))}

      <div className="ps-entity-card">
        <div className="ps-entity-title" style={{ marginBottom: 10 }}>Add a custom section</div>
        <Field label="Section type">
          <select className="ps-select" value={newType} onChange={(e) => setNewType(e.target.value)}>
            {CUSTOM_TYPE_OPTIONS.map((t) => <option key={t.value} value={t.value}>{t.label}</option>)}
          </select>
        </Field>
        <button className="ps-add-btn" onClick={addCustom}><Plus size={14} /> Add section</button>
      </div>
    </div>
  );
}

        value={p.cardPhoto}
        onChange={(v) => setProfile("cardPhoto", v)}
        hint="This is the small square photo on the card below — completely separate from your main About-section photo. Set it here; it won't use your other photo at all until you do. Use a tightly-cropped, square-friendly headshot for a clean fit."
      />

      <div className="ps-divider-label">Section heading</div>
      <SectionTextFields sectionId="contact" data={data} update={update} />

      <div className="ps-divider-label">Contact copy</div>
      <Field label="Heading"><input className="ps-input" value={c.heading} onChange={(e) => setContact("heading", e.target.value)} /></Field>
      <Field label="Description"><textarea className="ps-textarea" value={c.description} onChange={(e) => setContact("description", e.target.value)} /></Field>
      <Field label="Note (small box on the professional card)"><textarea className="ps-textarea" style={{ minHeight: 50 }} value={c.note} onChange={(e) => setContact("note", e.target.value)} /></Field>

      <div className="ps-divider-label">Footer</div>
      <Field label="Copyright line"><input className="ps-input" value={data.footer.copyright} onChange={(e) => setFooter("copyright", e.target.value)} /></Field>
      <p className="ps-hint">Email, phone, name, title and LinkedIn shown in this section come from the Profile tab.</p>
    </div>
  );
}

/* ---- Tab: Access (admin passcode) ---- */
function TabAccess({ data, update, onLockNow }) {
  const [current, setCurrent] = useState("");
  const [next, setNext] = useState("");
  const [confirm, setConfirm] = useState("");
  const [msg, setMsg] = useState(null);

  const change = () => {
    if (current !== data.studioAuth.pin) { setMsg({ type: "error", text: "Current passcode is incorrect." }); return; }
    if (next.length < 4) { setMsg({ type: "error", text: "New passcode should be at least 4 characters." }); return; }
    if (next !== confirm) { setMsg({ type: "error", text: "New passcode and confirmation don't match." }); return; }
    update((d) => ({ ...d, studioAuth: { ...d.studioAuth, pin: next } }));
    setMsg({ type: "ok", text: "Passcode updated." });
    setCurrent(""); setNext(""); setConfirm("");
  };

  return (
    <div>
      <div className="ps-entity-card">
        <div className="ps-entity-title" style={{ marginBottom: 6 }}>Change admin passcode</div>
        <p className="ps-hint" style={{ marginBottom: 12 }}>This passcode gates the Studio — visitors browsing the live portfolio never see it. Change it from the default before sharing your portfolio link.</p>
        <Field label="Current passcode"><input className="ps-input" type="password" value={current} onChange={(e) => setCurrent(e.target.value)} /></Field>
        <Field label="New passcode"><input className="ps-input" type="password" value={next} onChange={(e) => setNext(e.target.value)} /></Field>
        <Field label="Confirm new passcode"><input className="ps-input" type="password" value={confirm} onChange={(e) => setConfirm(e.target.value)} /></Field>
        {msg && <div style={{ fontSize: 12, color: msg.type === "error" ? "#f87171" : "#34d399", marginBottom: 10 }}>{msg.text}</div>}
        <button className="ps-btn-studio-primary" onClick={change}><ShieldCheck size={14} /> Update passcode</button>
      </div>
      <button className="ps-btn-studio-ghost" onClick={onLockNow}><Lock size={14} /> Lock Studio now</button>
    </div>
  );
}

/* ---- Tab: Data (export / import / reset) ---- */
function TabData({ data, update, onImportComplete }) {
  const fileRef = useRef(null);
  const [confirmReset, setConfirmReset] = useState(false);
  const [importWarning, setImportWarning] = useState(null);

  const exportData = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `portfolio-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  };

  const onFile = async (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    try {
      const text = await f.text();
      const parsed = JSON.parse(text);
      if (!validatePortfolioShape(parsed)) {
        setImportWarning("That file doesn't look like a Portfolio Studio backup — import cancelled.");
        return;
      }
      update(() => mergeWithDefaults(parsed));
      setImportWarning(null);
      if (onImportComplete) onImportComplete();
    } catch (err) {
      setImportWarning("Couldn't read that file as valid JSON — import cancelled.");
    } finally {
      if (fileRef.current) fileRef.current.value = "";
    }
  };

  const doReset = () => { update(() => JSON.parse(JSON.stringify(DEFAULT_DATA))); setConfirmReset(false); };

  return (
    <div>
      <div className="ps-entity-card">
        <div className="ps-entity-title" style={{ marginBottom: 6 }}>Export backup</div>
        <p className="ps-hint" style={{ marginBottom: 12 }}>Download your full portfolio configuration as JSON — content, sections, and theme.</p>
        <button className="ps-btn-studio-primary" onClick={exportData}><DownloadCloud size={14} /> Export portfolio</button>
      </div>

      <div className="ps-entity-card">
        <div className="ps-entity-title" style={{ marginBottom: 6 }}>Import backup</div>
        <p className="ps-hint" style={{ marginBottom: 12 }}>Restore from a previously exported JSON file. This replaces your current content — export a backup first if unsure.</p>
        <label className="ps-btn-studio-ghost" style={{ cursor: "pointer" }}>
          <UploadCloud size={14} /> Choose file…
          <input ref={fileRef} type="file" accept="application/json" style={{ display: "none" }} onChange={onFile} />
        </label>
        {importWarning && <div style={{ marginTop: 10, fontSize: 12, color: "#f87171", display: "flex", gap: 6 }}><AlertTriangle size={14} style={{ flexShrink: 0, marginTop: 1 }} />{importWarning}</div>}
      </div>

      <div className="ps-entity-card">
        <div className="ps-entity-title" style={{ marginBottom: 6, color: "#f87171" }}>Reset to default</div>
        <p className="ps-hint" style={{ marginBottom: 12 }}>Restores the original portfolio content, theme, and section order. This can't be undone unless you've exported a backup.</p>
        <button className="ps-btn-studio-danger" onClick={() => setConfirmReset(true)}><RotateCcw size={14} /> Reset everything</button>
      </div>

      {confirmReset && (
        <div className="ps-modal-overlay" onClick={() => setConfirmReset(false)}>
          <div className="ps-modal" onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
              <AlertTriangle size={20} style={{ color: "#f87171", flexShrink: 0 }} />
              <div>
                <div style={{ fontWeight: 700, fontSize: 14 }}>Reset the entire portfolio?</div>
                <div style={{ fontSize: 12.5, lineHeight: 1.6, color: "rgba(255,255,255,0.6)", marginTop: 6 }}>All content, theme choices, and section order will be replaced with the original defaults. This can't be undone.</div>
              </div>
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 20, justifyContent: "flex-end" }}>
              <button className="ps-btn-studio-ghost" onClick={() => setConfirmReset(false)}>Cancel</button>
              <button className="ps-btn-studio-danger" onClick={doReset}>Yes, reset</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const TABS = [
  { id: "profile", label: "Profile", icon: User },
  { id: "experience", label: "Experience", icon: Briefcase },
  { id: "education", label: "Education", icon: GraduationCap },
  { id: "projects", label: "Projects", icon: FolderKanban },
  { id: "skills", label: "Skills", icon: Wrench },
  { id: "contact", label: "Contact", icon: Mail },
  { id: "sections", label: "Sections", icon: ListOrdered },
  { id: "theme", label: "Theme", icon: Palette },
  { id: "access", label: "Access", icon: Lock },
  { id: "data", label: "Data", icon: FileJson },
];

function StudioPanel({ data, update, onClose, onLock, saveStatus, onManualSave }) {
  const [tab, setTab] = useState("profile");
  const props = { data, update };
  return (
    <div className="ps-studio-panel" role="dialog" aria-label="Portfolio Studio editor">
      <div className="ps-studio-head">
        <div className="ps-studio-brand"><Settings size={16} /> Portfolio Studio</div>
        <div className="ps-studio-head-actions">
          <button className="ps-studio-lockbtn" onClick={onLock} title="Lock Studio"><Lock size={15} /></button>
          <button className="ps-studio-close" onClick={onClose} aria-label="Close editor"><X size={16} /></button>
        </div>
      </div>
      <div className="ps-studio-tabs">
        {TABS.map((t) => (
          <button key={t.id} className={`ps-studio-tab ${tab === t.id ? "active" : ""}`} onClick={() => setTab(t.id)}>
            <t.icon size={13} /> {t.label}
          </button>
        ))}
      </div>
      <div className="ps-studio-body">
        {tab === "profile" && <TabProfile {...props} />}
        {tab === "experience" && <TabExperience {...props} />}
        {tab === "education" && <TabEducation {...props} />}
        {tab === "projects" && <TabProjects {...props} />}
        {tab === "skills" && <TabSkills {...props} />}
        {tab === "contact" && <TabContact {...props} />}
        {tab === "sections" && <TabSections {...props} />}
        {tab === "theme" && <TabTheme {...props} />}
        {tab === "access" && <TabAccess {...props} onLockNow={onLock} />}
        {tab === "data" && <TabData {...props} onImportComplete={() => setTab("profile")} />}
      </div>
      <div className="ps-studio-savebar">
        <SaveStatus status={saveStatus} />
        <button className="ps-btn-studio-primary" onClick={onManualSave} disabled={saveStatus === "saving"}>
          {saveStatus === "saving" ? <Loader2 size={14} className="spin" /> : <Save size={14} />} Save changes
        </button>
      </div>
    </div>
  );
}

function SaveStatus({ status }) {
  const map = {
    idle: { icon: <Check size={13} />, text: "Saved", cls: "saved" },
    saving: { icon: <Loader2 size={13} />, text: "Saving…", cls: "" },
    saved: { icon: <Check size={13} />, text: "Saved", cls: "saved" },
    unsaved: { icon: <Info size={13} />, text: "Unsaved changes", cls: "" },
    error: { icon: <AlertTriangle size={13} />, text: "Save failed — retrying", cls: "error" },
  };
  const s = map[status] || map.idle;
  return <span className={`ps-status ${s.cls}`}>{s.icon}{s.text}</span>;
}

function AdminLockModal({ onSubmit, onCancel, error }) {
  const [pin, setPin] = useState("");
  return (
    <div className="ps-modal-overlay" onClick={onCancel}>
      <div className="ps-modal" onClick={(e) => e.stopPropagation()}>
        <div className="ps-lock-icon-wrap"><Lock size={22} /></div>
        <div style={{ textAlign: "center", fontWeight: 700, fontSize: 15 }}>Portfolio Studio</div>
        <div style={{ textAlign: "center", fontSize: 12.5, color: "rgba(255,255,255,0.5)", marginTop: 6, marginBottom: 20 }}>Enter the admin passcode to edit this portfolio.</div>
        <input
          className="ps-input" type="password" placeholder="Passcode" value={pin} autoFocus
          onChange={(e) => setPin(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && onSubmit(pin)}
          style={{ textAlign: "center", letterSpacing: "0.1em", marginBottom: 10 }}
        />
        {error && <div style={{ fontSize: 12, color: "#f87171", textAlign: "center", marginBottom: 10 }}>{error}</div>}
        <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
          <button className="ps-btn-studio-ghost" style={{ flex: 1, justifyContent: "center" }} onClick={onCancel}>Cancel</button>
          <button className="ps-btn-studio-primary" style={{ flex: 1, justifyContent: "center" }} onClick={() => onSubmit(pin)}><Unlock size={14} /> Unlock</button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   ROOT APP
   ============================================================ */
export default function PortfolioStudioApp() {
  const [data, setData] = useState(DEFAULT_DATA);
  const [loaded, setLoaded] = useState(false);
  const [authed, setAuthed] = useState(false);
  const [showLock, setShowLock] = useState(false);
  const [lockError, setLockError] = useState(null);
  const [studioOpen, setStudioOpen] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [scrolled, setScrolled] = useState(false);
  const [parallax, setParallax] = useState(0);
  const [activeSection, setActiveSection] = useState("about");
  const [saveStatus, setSaveStatus] = useState("idle");
  const isFirstLoad = useRef(true);

  useEffect(() => {
    (async () => {
      const loadedData = await loadPortfolio();
      if (loadedData) {
        const merged = mergeWithDefaults(loadedData);
        // Migrate the original demo credential to the requested admin password once.
        if (merged.studioAuth?.pin === "studio2026") merged.studioAuth.pin = "Valsala@1967#";
        setData(merged);
      }
      setLoaded(true);
      window.setTimeout(() => document.getElementById("site-loader")?.classList.add("is-hidden"), 650);
    })();
  }, []);

  useEffect(() => {
    const onScroll = () => {
      setScrolled(window.scrollY > 20);
      setParallax(window.scrollY * 0.15);
      const visible = data.sections.filter((s) => s.visible).sort((a, b) => a.order - b.order);
      let current = visible[0]?.id || "about";
      for (const s of visible) {
        const el = document.getElementById(s.id);
        if (el && el.getBoundingClientRect().top <= 140) current = s.id;
      }
      setActiveSection(current);
    };
    window.addEventListener("scroll", onScroll);
    return () => window.removeEventListener("scroll", onScroll);
  }, [data.sections]);

  const update = useCallback((updater) => {
    setData((prev) => (typeof updater === "function" ? updater(prev) : updater));
    setSaveStatus("unsaved");
  }, []);

  const doSave = useCallback(async (payload) => {
    setSaveStatus("saving");
    try {
      await savePortfolio(payload);
      setSaveStatus("saved");
    } catch (e) {
      setSaveStatus("error");
    }
  }, []);

  useDebouncedEffect(() => {
    if (!loaded) return;
    if (isFirstLoad.current) { isFirstLoad.current = false; return; }
    doSave(data);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [data, loaded], 700);

  const goTo = useCallback((id) => {
    setActiveSection(id);
    setMenuOpen(false);
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }, []);

  const manualSave = () => doSave(data);

  useEffect(() => {
    const flush = () => {
      try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    };
    window.addEventListener("beforeunload", flush);
    window.addEventListener("pagehide", flush);
    return () => { window.removeEventListener("beforeunload", flush); window.removeEventListener("pagehide", flush); };
  }, [data]);

  const requestStudio = () => {
    if (authed) setStudioOpen(true);
    else { setLockError(null); setShowLock(true); }
  };
  const submitLock = (pin) => {
    if (pin === data.studioAuth.pin) {
      setAuthed(true); setShowLock(false); setLockError(null); setStudioOpen(true);
    } else {
      setLockError("Incorrect passcode. Try again.");
    }
  };
  const lockNow = () => { setAuthed(false); setStudioOpen(false); };

  return (
    <div className="ps-root">
      <GlobalStyle theme={data.theme} />
      <Header data={data} activeSection={activeSection} goTo={goTo} menuOpen={menuOpen} setMenuOpen={setMenuOpen} scrolled={scrolled} />
      <PublicSite data={data} parallax={parallax} goTo={goTo} />

      <button
        className={`ps-studio-toggle ${studioOpen ? "open" : ""}`}
        onClick={requestStudio}
        title="Portfolio Studio"
        aria-label="Open Portfolio Studio"
      >
        <Settings size={20} />
      </button>

      {showLock && <AdminLockModal onSubmit={submitLock} onCancel={() => setShowLock(false)} error={lockError} />}

      {studioOpen && authed && (
        <StudioPanel
          data={data}
          update={update}
          onClose={() => setStudioOpen(false)}
          onLock={lockNow}
          saveStatus={saveStatus}
          onManualSave={manualSave}
        />
      )}
    </div>
  );
}

createRoot(document.getElementById("root")).render(<PortfolioStudioApp />);

</script>
